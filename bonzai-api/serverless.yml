org: ${file(./config.yml):aws.org}
service: bonzai-api

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-north-1
  iam: 
    role: ${file(./config.yml):aws.role}

functions:
  GetBookings:
      handler: functions/GetBookings/index.handler
      events:
          - httpApi:
              path: /api/bookings
              method: GET
  GetBookingById:
      handler: functions/GetBookingById/index.handler
      events:
          - httpApi:
              path: /api/booking/{id}
              method: GET
  PostBooking:
      handler: functions/PostBookings/index.handler
      events:
          - httpApi:
              path: /api/bookings
              method: POST
  DeleteBookingById:
    handler: functions/DeleteBookingById/index.handler
    events:
          - httpApi:
              path: /api/booking/{id}
              method: DELETE

  UpdateBooking:
    handler: functions/UpdateBookingById/index.handler
    events:
          - httpApi:
              path: /api/bookings/{id}
              method: PUT

resources: 
  Resources: 
    BonzaiTable:
      Type: AWS::DynamoDB::Table
      Properties: 
        TableName: bonzai-table
        AttributeDefinitions: 
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema: 
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST